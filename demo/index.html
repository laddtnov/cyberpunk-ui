<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@laddtnov/cyberpunk-ui — demo</title>
  <meta name="description" content="Live demo of @laddtnov/cyberpunk-ui — a zero-dependency cyberpunk neon CSS kit: design tokens, glow/glitch/scanline effects, and holo components.">
  <meta name="author" content="Vladyslav Novytskyi">

  <!-- Social link previews (LinkedIn, X, Slack, Discord).
       og:image must be an absolute URL — relative paths are ignored by crawlers. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="@laddtnov/cyberpunk-ui">
  <meta property="og:url" content="https://laddtnov.github.io/cyberpunk-ui/demo/">
  <meta property="og:title" content="@laddtnov/cyberpunk-ui — cyberpunk neon CSS kit">
  <meta property="og:description" content="Zero-dependency CSS kit: neon design tokens, glow/glitch/scanline effects, and glassmorphism components. WCAG-aware light theme, reduced-motion friendly, no build step.">
  <meta property="og:image" content="https://laddtnov.github.io/cyberpunk-ui/demo/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="628">
  <meta property="og:image:alt" content="Neon cyberpunk UI demo showing a glowing CYBERPUNK-UI title, neon buttons, glowing text and holo cards on a dark grid background.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="@laddtnov/cyberpunk-ui — cyberpunk neon CSS kit">
  <meta name="twitter:description" content="Zero-dependency CSS kit: neon design tokens, glow/glitch/scanline effects, and glassmorphism components.">
  <meta name="twitter:image" content="https://laddtnov.github.io/cyberpunk-ui/demo/og-image.png">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../cyberpunk-ui.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cy-bg);
      color: var(--cy-text);
      font-family: var(--cy-font-body);
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; display: flex; flex-direction: column; gap: 2.5rem; }
    h1 { font-family: var(--cy-font-display); font-size: clamp(2rem, 7vw, 4rem); letter-spacing: 0.14em; margin: 0; }
    h2 { font-family: var(--cy-font-mono); color: var(--cy-neon-pink); font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 1rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .hero { padding: 3rem 2rem; border-radius: 12px; }
    .mono { font-family: var(--cy-font-mono); }

    /* ── Top bar — styled entirely with the package's own tokens ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      padding: 0.85rem 1.5rem;
      background: var(--cy-surface);
      border-bottom: 1px solid rgba(var(--cy-cyan-rgb), 0.3);
      box-shadow: 0 0 24px rgba(var(--cy-cyan-rgb), 0.12);
    }
    .topbar__name {
      font-family: var(--cy-font-mono);
      color: var(--cy-neon-cyan);
      letter-spacing: 0.08em;
      font-size: 0.95rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .topbar__spacer { flex: 1 1 auto; }
    .install {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--cy-font-mono);
      font-size: 0.8rem;
      color: var(--cy-text);
      background: rgba(var(--cy-cyan-rgb), 0.06);
      border: 1px dashed rgba(var(--cy-cyan-rgb), 0.4);
      border-radius: 4px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .install:hover { border-style: solid; border-color: var(--cy-neon-cyan); }
    .install__hint { color: var(--cy-neon-pink); font-size: 0.7rem; letter-spacing: 0.08em; }
    .topbar__links { display: flex; gap: 0.5rem; align-items: center; }
    .topbar .cy-btn { font-size: 0.75rem; padding: 0.4rem 0.9rem; }

    @media (max-width: 640px) {
      .topbar { justify-content: center; }
      .topbar__spacer { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="topbar__name" href="https://github.com/laddtnov/cyberpunk-ui">&gt;_ @laddtnov/cyberpunk-ui</a>

    <button type="button" class="install" id="install" aria-label="Copy install command">
      <span id="install-cmd">npm i @laddtnov/cyberpunk-ui</span>
      <span class="install__hint" id="install-hint">COPY</span>
    </button>

    <span class="topbar__spacer"></span>

    <nav class="topbar__links">
      <a class="cy-btn" href="https://www.npmjs.com/package/@laddtnov/cyberpunk-ui" target="_blank" rel="noopener noreferrer">npm</a>
      <a class="cy-btn" href="https://github.com/laddtnov/cyberpunk-ui" target="_blank" rel="noopener noreferrer">GitHub</a>
      <button type="button" class="cy-btn cy-btn--pink" id="theme" aria-label="Toggle light and dark theme">THEME</button>
    </nav>
  </header>

  <div class="wrap">
    <section class="hero cy-grid-bg cy-scanlines">
      <h1 class="cy-glitch">CYBERPUNK-UI</h1>
      <p class="mono">deep space observatory <span class="cy-cursor"></span></p>
    </section>

    <section>
      <h2>Buttons</h2>
      <div class="row">
        <a href="#" class="cy-btn cy-glow">&gt;_ ENTER</a>
        <a href="#" class="cy-btn cy-btn--pink cy-glow--pink">ABORT</a>
        <a href="#" class="cy-btn">GHOST</a>
      </div>
    </section>

    <section>
      <h2>Text glow</h2>
      <div class="row">
        <span class="cy-text-glow mono" style="font-size:1.4rem">NEON CYAN</span>
        <span class="cy-text-glow--pink mono" style="font-size:1.4rem">NEON PINK</span>
      </div>
    </section>

    <section>
      <h2>Holo cards</h2>
      <div class="row" style="align-items:stretch">
        <div class="cy-card" style="flex:1; min-width:220px">
          <h3 style="margin:0 0 .5rem; color:var(--cy-heading)">Galaxy Map</h3>
          <p style="margin:0">Click-to-travel navigation across a spinning canvas universe.</p>
        </div>
        <div class="cy-card cy-glow--purple" style="flex:1; min-width:220px">
          <h3 style="margin:0 0 .5rem; color:var(--cy-heading)">Void Sector</h3>
          <p style="margin:0">Black holes, supermassive stars, and cosmic voids.</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Theme toggle
    document.getElementById('theme').addEventListener('click', () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    });

    // Copy the install command. If the Clipboard API is unavailable or blocked
    // (permissions, insecure context), fall back to selecting the text so the
    // visitor can still hit Cmd/Ctrl+C.
    const installBtn = document.getElementById('install');
    const cmdEl = document.getElementById('install-cmd');
    const hint = document.getElementById('install-hint');

    installBtn.addEventListener('click', async () => {
      const cmd = cmdEl.textContent.trim();
      try {
        await navigator.clipboard.writeText(cmd);
        hint.textContent = 'COPIED!';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(cmdEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        hint.textContent = 'PRESS ⌘C';
      }
      setTimeout(() => { hint.textContent = 'COPY'; }, 2000);
    });
  </script>
</body>
</html>
