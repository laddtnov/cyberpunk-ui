name: CI

# The package had no pull-request checks at all — release.yml only runs after
# a tag, so a contrast regression or a broken files allowlist would not surface
# until after publish.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: WCAG contrast check
        run: npm run check:contrast

      # The conventions in docs/STATE.md that a generic CSS linter cannot know:
      # -rgb twins, class naming, no unscoped element selectors, barrel/exports
      # wiring, and docs that only name things which exist.
      - name: Convention check
        run: npm run check:conventions

      # Catches an over-broad or over-narrow files allowlist before release.
      - name: Verify tarball contents
        run: npm pack --dry-run
