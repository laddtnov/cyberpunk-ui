name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Running from Actions (rather than a laptop) buys two things:
#   1. npm provenance — a signed, verifiable link between the published tarball
#      and the exact commit + workflow that produced it, shown on the npm page.
#   2. No local publish friction: no 2FA prompt, no CloudStorage path issues.
#
# Authentication is npm trusted publishing (OIDC), not a token. The package's
# trusted-publisher configuration on npmjs.com names this repository and this
# workflow filename, and npm trusts the short-lived identity GitHub mints for
# the run. Renaming this file, or moving the publish into a different
# workflow, breaks publishing until the configuration is updated to match.
#
# It replaced NPM_TOKEN in 0.10.0 after the token path failed four times in a
# row: the token expired (E404 on PUT, which is npm reporting auth failure as
# "not found"), and once replaced, every attempt hit EOTP — a 2FA setting
# demanding a one-time password that no CI job can produce.
#
# It can also be run by hand against an existing tag, from Actions → Release →
# Run workflow. That exists because a tag push is a single event: if Actions is
# down or degraded when the tag lands, the run is simply never created, and the
# only other way back in is deleting and re-pushing the tag. v0.5.0 was tagged
# during an Actions outage and needed exactly that.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.5.0'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # REQUIRED for npm provenance (OIDC signing)
  packages: write   # mirror the tarball to GitHub Packages

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      # On a tag push this is the tag; on a manual run it is the tag typed into
      # the form. Nothing here ever publishes from a branch.
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The tag name is needed by later steps, and the two triggers carry it in
      # different places. Resolved once, here, so nothing downstream has to
      # care which event started the run.
      #
      # Both values go through the environment rather than being interpolated
      # into the script: `${{ inputs.tag }}` is attacker-controlled text in the
      # general case, and pasting it straight into a shell is how workflows get
      # command injection.
      - name: Resolve the tag being released
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$PUSHED_REF}"

          # Shape check: must look like a version tag, not a branch.
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::'$TAG' is not a version tag. Expected something like v0.5.0."
              exit 1
              ;;
          esac

          # Charset check. The glob above still admits anything after the
          # digits, including whitespace and newlines — and this value is
          # written to GITHUB_OUTPUT, where an embedded newline could forge a
          # second output. Strip everything legal and require nothing to be
          # left. Dispatch already needs write access, so this is depth rather
          # than the only line of defence, but the file holds an npm token.
          if [ -n "$(printf '%s' "$TAG" | tr -d 'A-Za-z0-9.+-')" ]; then
            echo "::error::Tag contains characters outside [A-Za-z0-9.+-]."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      # Fail fast on a mismatch rather than publishing a version whose tag lies.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "tag: $TAG_VERSION | package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Node 22.14 is the floor for trusted publishing; 24 is what npm's own
      # example uses. The npm upgrade is deliberate rather than trusting
      # whatever the image ships: trusted publishing needs npm 11.5.1 or
      # later, and a too-old CLI falls back to token auth and fails with the
      # same EOTP this change exists to remove.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Node 24 bundles npm 11.19.1 (and has bundled >= 11.5.1 since 24.5.0),
      # so nothing is installed here — this only asserts it, because a CLI
      # older than 11.5.1 does not fail loudly: it falls back to token auth
      # and dies with the same EOTP this change removes.
      #
      # An earlier version of this step ran `npm install -g npm@latest`, which
      # Sonar flagged twice and was right to: an unpinned install with
      # lifecycle scripts enabled, inside the job that publishes the package,
      # is exactly the supply-chain shape to avoid. Not installing beats
      # installing carefully.
      - name: Verify npm supports trusted publishing
        run: |
          echo "npm $(npm -v)"
          node -e '
            const v = require("child_process").execSync("npm -v").toString().trim();
            const [maj, min, pat] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error("::error::npm " + v + " is older than 11.5.1, which trusted publishing requires."); process.exit(1); }
          '

      # The package is dependency-free CSS, so there is nothing to install or
      # build — but confirm the tarball contains exactly what we expect.
      - name: Inspect the tarball contents
        run: npm publish --dry-run

      # No token. npm authenticates with the OIDC identity GitHub mints for
      # this workflow, which the package's trusted-publisher configuration
      # names. That is the whole point of the change: a token could expire
      # (it did), and an account or package 2FA setting could demand a
      # one-time password that CI can never supply (it did, four times).
      #
      # --provenance is gone because trusted publishing generates and
      # publishes the attestation on its own for a public repo and package.
      - name: Publish to npm
        run: npm publish --access public

      # Mirror to GitHub Packages purely so the package shows up in the repo's
      # and profile's Packages section. This is NOT a usable install channel:
      # GitHub Packages demands authentication even for public packages, so
      # npmjs.org remains the canonical registry (and the only one that carries
      # the provenance attestation).
      #
      # continue-on-error: a hiccup mirroring must never fail a release whose
      # real publish already succeeded.
      - name: Mirror to GitHub Packages
        continue-on-error: true
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --verify-tag makes this fail rather than invent a tag if the ref is
      # somehow missing. Skipped when a release for the tag already exists, so
      # re-running by hand after a partial failure does not error out on the
      # last step.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
